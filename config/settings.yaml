scoring:
  min_score: 0.0
filters:
  require_known_sponsor: true
sources:
  intern_list:
    url: https://www.intern-list.com/?k=aiml
    enabled: true
  newgrad_jobs:
    url: https://www.newgrad-jobs.com/
    enabled: true
    # one jobright vertical per resume track (ml_ai → AI/ML, swe → SWE, data_* → DS)
    verticals: [ml_ai, swe, data_science, data_analysis]
    max_per_vertical: 400
  google_careers:
    enabled: true
    queries:
    - machine learning
    - artificial intelligence
    locations:
    - United States
    - India
    target_levels:
    - EARLY
    - INTERN_AND_APPRENTICE
    max_per_query: 200
recruiters:
  enabled: true
  from_statuses:
  - approved
  - queued
  max_companies: 25
  max_per_company: 8
  pace_seconds: 5.0
  titles:
  - recruiter
  - technical recruiter
  - talent acquisition
  - university recruiter
  - campus recruiter
  - sourcer
llm:
  provider: claude_cli
  groq_model: llama-3.1-8b-instant
  gemini_model: gemini-2.5-flash
  anthropic_model: claude-sonnet-4-6
  claude_cli_model: haiku            # tailoring (bulk, cheap) — provider claude_cli, local only
  ats_model: sonnet                  # on-demand ATS score check (button in the job drawer)
  claude_cli_config_dir: ~/.claude-beti  # which logged-in Claude account the CLI bills
tracker:
  db_path: tracker/applications.db
output:
  resumes_dir: output/resumes
  logs_dir: logs
notifications:
  on_offer: true
  on_interview: true
  email_to: ''
