search:
  keywords:
  - artificial intelligence
  - machine learning
  - AI
  - ML
  - LLM
  - deep learning
  - NLP
  - generative AI
  - RAG
  - computer vision
  - data science
  role_types:
  - new grad
  - new graduate
  - entry level
  - early career
  - university graduate
  - full time
  - intern
  - internship
  - co-op
  location: USA
  exclude_keywords:
  - no visa
  - no sponsorship
  - citizens only
  - clearance required
  - security clearance
  deprioritize_seniority:
  - senior
  - staff
  - principal
  - lead
  - manager
  - director
  - 5+ years
scoring:
  weights:
    keyword_match: 0.4
    role_relevance: 0.3
    recency: 0.2
    sponsorship_friendly: 0.1
  min_score: 0.0
filters:
  require_known_sponsor: true
sources:
  intern_list:
    url: https://www.intern-list.com/?k=aiml
    enabled: true
  newgrad_jobs:
    url: https://www.newgrad-jobs.com/?k=aiml
    enabled: true
  google_careers:
    enabled: true
    queries:
    - machine learning
    - artificial intelligence
    locations:
    - United States
    - India
    target_levels:
    - EARLY
    - INTERN_AND_APPRENTICE
    max_per_query: 200
  linkedin:
    enabled: false
    search_query: AI ML internship
    easy_apply_only: true
    max_jobs: 60
  handshake:
    enabled: false
    queries:
    - intern
    - software intern
    - data intern
    - AI intern
    - machine learning intern
    max_jobs: 80
recruiters:
  enabled: true
  from_statuses:
  - approved
  - queued
  max_companies: 25
  max_per_company: 8
  pace_seconds: 5.0
  titles:
  - recruiter
  - technical recruiter
  - talent acquisition
  - university recruiter
  - campus recruiter
  - sourcer
linkedin:
  email: ''
  password: ''
handshake:
  email: ''
  password: ''
llm:
  provider: groq
  groq_model: llama-3.1-8b-instant
  gemini_model: gemini-2.5-flash
  anthropic_model: claude-sonnet-4-6
tracker:
  db_path: tracker/applications.db
output:
  resumes_dir: output/resumes
  logs_dir: logs
notifications:
  on_offer: true
  on_interview: true
  email_to: ''
