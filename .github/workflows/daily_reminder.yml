name: Daily Reminder

# Emails a short daily nudge: what to apply to (approved/queued + top new
# H-1B-sponsor roles), who to ask for a referral (LinkedIn connections not yet
# messaged), and follow-ups due.
#
# Opt-in: it only sends if the SMTP secrets below are set (SMTP_USER +
# SMTP_PASSWORD, or the legacy GMAIL_* pair). Without them the job runs and
# no-ops gracefully. Reads the shared DB from Turso like the daily pipeline.
#
# NOTE ON DATA: GitHub reads Turso, which holds the scraped jobs. Your applied
# statuses and LinkedIn connections live in your LOCAL DB unless synced to Turso
# (see README → "Daily reminder"), so in cloud mode the Apply/sponsor section is
# always populated; the referral + follow-up sections reflect whatever is in
# Turso.
#
# TIME: cron is UTC. 14:00 UTC ≈ 9 AM Central during CDT (summer) / 8 AM during
# CST (winter). Adjust the cron if you want a fixed local hour year-round.

on:
  schedule:
    - cron: '0 14 * * *'   # daily 14:00 UTC (~9 AM Central, CDT)
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Send daily reminder
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:          ${{ secrets.SMTP_FROM }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py --remind
